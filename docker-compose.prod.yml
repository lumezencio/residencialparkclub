services:
  db:
    image: postgres:16
    container_name: parkclub_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-residencialparkclub}
      POSTGRES_USER: ${POSTGRES_USER:-enterprise_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  web:
    build: .
    container_name: parkclub_web
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: parkclub.settings_prod
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-residencialparkclub}
      DB_USER: ${DB_USER:-enterprise_user}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      - db
    networks:
      - backend

# NOTA: O nginx e certbot foram movidos para o proxy compartilhado em /opt/proxy/
# Isso evita conflitos de porta 80/443 com outros projetos no mesmo servidor.
# Para subir/parar o proxy: cd /opt/proxy && docker compose up -d

volumes:
  pgdata:
  static_files:
  media_files:
  certbot_www:
  certbot_certs:

networks:
  backend:
