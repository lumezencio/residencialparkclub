services:
  db:
    image: postgres:16
    container_name: parkclub_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-residencialparkclub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - parkclub_pgdata:/var/lib/postgresql/data

volumes:
  parkclub_pgdata:
